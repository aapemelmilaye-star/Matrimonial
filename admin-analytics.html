<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Aape Mel Milaye | Private Analytics</title>
<style>
:root {
  --maroon: #7d1717;
  --maroon-dark: #4e0e0e;
  --cream: #fff8ec;
  --line: #ead7bd;
  --muted: #7f6753;
  --ink: #24160f;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg, #fff8ec 0%, #fffdf7 100%);
  color: var(--ink);
}
header {
  background: var(--maroon-dark);
  color: white;
  padding: 20px;
}
main {
  max-width: 1120px;
  margin: 0 auto;
  padding: 22px;
}
h1, h2 { margin: 0; }
.subtitle { margin: 7px 0 0; color: #f8dfb7; }
.panel, .card, table {
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-shadow: 0 12px 30px rgba(89, 29, 16, 0.08);
}
.panel { padding: 18px; margin-bottom: 18px; }
.form-grid {
  display: grid;
  grid-template-columns: 1.5fr 1fr auto;
  gap: 12px;
  align-items: end;
}
label { display: block; font-weight: 700; color: var(--maroon); margin-bottom: 6px; }
input {
  width: 100%;
  border: 1px solid var(--line);
  border-radius: 8px;
  padding: 12px;
  font: inherit;
}
button {
  border: 0;
  border-radius: 8px;
  padding: 13px 18px;
  background: var(--maroon);
  color: white;
  font: inherit;
  font-weight: 700;
  cursor: pointer;
}
.message { margin-top: 12px; color: var(--maroon); font-weight: 700; }
.cards {
  display: grid;
  grid-template-columns: repeat(4, minmax(160px, 1fr));
  gap: 14px;
  margin-bottom: 18px;
}
.card { padding: 18px; }
.card span { display: block; color: var(--muted); font-weight: 700; }
.card strong { display: block; margin-top: 8px; color: var(--maroon); font-size: 32px; }
.grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(260px, 1fr));
  gap: 18px;
}
.list { padding: 0; margin: 12px 0 0; list-style: none; }
.list li {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 9px 0;
  border-bottom: 1px solid #f1e3cf;
}
.bar-wrap { margin-top: 12px; }
.bar-row { display: grid; grid-template-columns: 92px 1fr 48px; gap: 9px; align-items: center; margin-bottom: 8px; }
.bar { height: 12px; border-radius: 999px; background: #f3dec1; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--maroon); }
table { width: 100%; border-collapse: collapse; margin-top: 18px; overflow: hidden; }
th, td { text-align: left; padding: 10px; border-bottom: 1px solid #f1e3cf; vertical-align: top; }
th { color: var(--maroon); background: #fff3e1; }
td { color: #4c3828; font-size: 14px; }
@media (max-width: 760px) {
  .form-grid, .cards, .grid { grid-template-columns: 1fr; }
  .bar-row { grid-template-columns: 78px 1fr 36px; }
}
</style>
</head>
<body>
<header>
  <h1>Aape Mel Milaye Analytics</h1>
  <p class="subtitle">Private visit dashboard for admin use only.</p>
</header>
<main>
  <section class="panel">
    <div class="form-grid">
      <div>
        <label for="appsUrl">Apps Script Web App URL</label>
        <input id="appsUrl" placeholder="https://script.google.com/macros/s/.../exec">
      </div>
      <div>
        <label for="adminKey">Admin Analytics Key</label>
        <input id="adminKey" type="password" placeholder="Private key from Code.gs">
      </div>
      <button onclick="loadStats()">Load Stats</button>
    </div>
    <div class="message" id="message"></div>
  </section>

  <section id="dashboard" style="display:none">
    <div class="cards">
      <div class="card"><span>Total visits</span><strong id="total">0</strong></div>
      <div class="card"><span>Today</span><strong id="today">0</strong></div>
      <div class="card"><span>Last 7 days</span><strong id="last7">0</strong></div>
      <div class="card"><span>Last 30 days</span><strong id="last30">0</strong></div>
    </div>

    <div class="grid">
      <div class="panel">
        <h2>Daily Trend</h2>
        <div class="bar-wrap" id="daily"></div>
      </div>
      <div class="panel">
        <h2>Visit Sources</h2>
        <ul class="list" id="sources"></ul>
      </div>
      <div class="panel">
        <h2>Timezones</h2>
        <ul class="list" id="timezones"></ul>
      </div>
      <div class="panel">
        <h2>Languages</h2>
        <ul class="list" id="languages"></ul>
      </div>
    </div>

    <table>
      <thead><tr><th>Time</th><th>Page</th><th>Source</th><th>Timezone</th><th>Referrer</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
  </section>
</main>
<script>
const savedUrl = localStorage.getItem("ammAppsUrl") || "";
document.getElementById("appsUrl").value = savedUrl;

function api(appsUrl, payload) {
  return new Promise((resolve, reject) => {
    const callbackName = "ammAnalyticsCallback_" + Date.now() + "_" + Math.floor(Math.random() * 100000);
    const script = document.createElement("script");
    const timer = setTimeout(() => {
      cleanup();
      reject(new Error("Could not connect to Apps Script."));
    }, 30000);
    function cleanup() {
      clearTimeout(timer);
      delete window[callbackName];
      if (script.parentNode) script.parentNode.removeChild(script);
    }
    window[callbackName] = data => {
      cleanup();
      data && data.ok ? resolve(data) : reject(new Error((data && data.message) || "Request failed."));
    };
    const url = new URL(appsUrl);
    url.searchParams.set("callback", callbackName);
    url.searchParams.set("payload", JSON.stringify(payload));
    script.onerror = () => {
      cleanup();
      reject(new Error("Could not load analytics script."));
    };
    script.src = url.toString();
    document.body.appendChild(script);
  });
}

async function loadStats() {
  const appsUrl = document.getElementById("appsUrl").value.trim();
  const secret = document.getElementById("adminKey").value.trim();
  const msg = document.getElementById("message");
  msg.textContent = "Loading...";
  try {
    localStorage.setItem("ammAppsUrl", appsUrl);
    const data = await api(appsUrl, { action: "analyticsSummary", secret });
    renderStats(data);
    msg.textContent = "Updated successfully.";
  } catch (err) {
    document.getElementById("dashboard").style.display = "none";
    msg.textContent = err.message;
  }
}

function renderStats(data) {
  document.getElementById("dashboard").style.display = "block";
  ["total", "today", "last7", "last30"].forEach(id => {
    document.getElementById(id).textContent = Number(data[id] || 0).toLocaleString("en-IN");
  });
  renderBars("daily", data.daily || []);
  renderList("sources", data.sources || []);
  renderList("timezones", data.timezones || []);
  renderList("languages", data.languages || []);
  document.getElementById("recent").innerHTML = (data.recent || []).map(row => `
    <tr>
      <td>${escapeHtml(formatDate(row.timestamp))}</td>
      <td>${escapeHtml(row.page || "")}</td>
      <td>${escapeHtml(row.source || "")}</td>
      <td>${escapeHtml(row.timezone || "")}</td>
      <td>${escapeHtml(row.referrer || "")}</td>
    </tr>
  `).join("");
}

function renderBars(id, rows) {
  const max = Math.max(1, ...rows.map(row => Number(row.visits || 0)));
  document.getElementById(id).innerHTML = rows.map(row => `
    <div class="bar-row">
      <span>${escapeHtml(String(row.date || "").slice(5))}</span>
      <div class="bar"><i style="width:${Math.round((Number(row.visits || 0) / max) * 100)}%"></i></div>
      <strong>${Number(row.visits || 0)}</strong>
    </div>
  `).join("");
}

function renderList(id, rows) {
  document.getElementById(id).innerHTML = rows.length
    ? rows.map(row => `<li><span>${escapeHtml(row.name || "Unknown")}</span><strong>${Number(row.count || 0)}</strong></li>`).join("")
    : `<li><span>No data yet</span><strong>0</strong></li>`;
}

function formatDate(value) {
  const d = new Date(value);
  return Number.isNaN(d.getTime()) ? String(value || "") : d.toLocaleString();
}

function escapeHtml(value) {
  return String(value ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}
</script>
</body>
</html>
